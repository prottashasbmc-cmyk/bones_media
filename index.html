<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBMC Bones Media by Prottasha</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- PapaParse for robust CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fcfcfd;
            color: #1a1a1a;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-track {
            background: transparent; 
        }
        ::-webkit-scrollbar-thumb {
            background: #e2e8f0; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #cbd5e1; 
        }
        
        .loader {
            border: 3px solid #f1f5f9;
            border-top: 3px solid #dc2626;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .card-hover {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1);
        }

        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.08);
        }
        
        .animate-fade-in {
            animation: fadeIn 0.6s ease-out forwards;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-zoom-in {
            animation: zoomIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes zoomIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .glass-nav {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1.1em;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .line-clamp-custom {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        const INITIAL_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vR0cj3DJz35_KETzh56DM3-IK7dvSgSdO45URFv3Xj4wEUlpejjE09F6iJyfejuPRPRqCOALW5RRnML/pub?output=csv";
        const FACEBOOK_URL = "https://www.facebook.com/people/Prottasha-SBMC/61584373444008/";
        const WHATSAPP_NUMBERS = ["+8801786792502", "+88013443443104"];

        const formatImageUrl = (url) => {
            if (!url) return null;
            let formatted = String(url).trim();
            if (formatted.includes('drive.google.com')) {
                const idMatch = formatted.match(/\/d\/([a-zA-Z0-9_-]+)/) || 
                               formatted.match(/id=([a-zA-Z0-9_-]+)/) || 
                               formatted.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                if (idMatch && idMatch[1]) {
                    return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w1200`;
                }
            }
            return formatted;
        };

        const formatFriendlyDate = (dateString) => {
            if (!dateString) return null;
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString;
            return date.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                year: date.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined 
            });
        };

        const ImagePopover = ({ imageUrl, title, onClose }) => {
            if (!imageUrl) return null;
            
            useEffect(() => {
                const handleEsc = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', handleEsc);
                document.body.style.overflow = 'hidden';
                return () => {
                    window.removeEventListener('keydown', handleEsc);
                    document.body.style.overflow = 'unset';
                };
            }, [onClose]);

            return (
                <div 
                    className="fixed inset-0 z-[100] flex items-center justify-center p-4 sm:p-8 bg-white/60 backdrop-blur-xl animate-fade-in"
                    onClick={onClose}
                >
                    <div 
                        className="relative max-w-5xl w-full max-h-full flex flex-col items-center animate-zoom-in"
                        onClick={e => e.stopPropagation()}
                    >
                        <button 
                            onClick={onClose}
                            className="absolute -top-16 right-0 md:-right-12 w-12 h-12 flex items-center justify-center rounded-full bg-slate-900/10 hover:bg-red-600 text-slate-900 hover:text-white transition-all duration-300 group shadow-lg border border-slate-900/5 backdrop-blur-md"
                            aria-label="Close"
                        >
                            <i className="fas fa-times text-xl group-hover:scale-110 transition-transform"></i>
                        </button>
                        
                        <img 
                            src={imageUrl} 
                            alt={title}
                            className="max-w-full max-h-[80vh] object-contain rounded-2xl shadow-2xl ring-1 ring-slate-900/10"
                            onError={(e) => { e.target.src = 'https://placehold.co/800x600/f1f5f9/94a3b8?text=Image+Unavailable'; }}
                        />
                        
                        <div className="mt-6 text-center px-4 bg-white/80 backdrop-blur-md py-2 px-6 rounded-full border border-white/50 shadow-sm">
                            <h3 className="text-slate-900 text-lg font-bold tracking-tight">{title}</h3>
                        </div>
                    </div>
                </div>
            );
        };

        const ExpandableDescription = ({ text }) => {
            const [isExpanded, setIsExpanded] = useState(false);
            const needsExpansion = text && text.length > 85;

            if (!text) return null;

            return (
                <div className="mb-6">
                    <p className={`text-slate-500 text-xs leading-relaxed italic ${!isExpanded && needsExpansion ? 'line-clamp-custom' : ''}`}>
                        {text}
                    </p>
                    {needsExpansion && (
                        <button 
                            onClick={(e) => { e.stopPropagation(); setIsExpanded(!isExpanded); }}
                            className="mt-1.5 text-[10px] font-extrabold text-red-500 uppercase tracking-wider hover:text-red-700 transition-colors flex items-center gap-1"
                        >
                            {isExpanded ? (
                                <React.Fragment>Read Less <i className="fas fa-chevron-up text-[8px]"></i></React.Fragment>
                            ) : (
                                <React.Fragment>Read More <i className="fas fa-chevron-down text-[8px]"></i></React.Fragment>
                            )}
                        </button>
                    )}
                </div>
            );
        };

        const Navbar = ({ searchTerm, setSearchTerm, sortOrder, setSortOrder, onRefresh, loading }) => (
            <nav className="glass-nav border-b border-slate-100 sticky top-0 z-50 shadow-[0_2px_15px_-3px_rgba(0,0,0,0.04)]">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex flex-col md:flex-row justify-between items-center h-auto md:h-20 py-5 md:py-0 gap-5">
                        <div className="flex items-center group cursor-pointer" onClick={() => window.location.reload()}>
                            <div className="bg-red-600 text-white p-2.5 rounded-2xl mr-4 shadow-xl shadow-red-100 group-hover:rotate-6 transition-transform">
                                <i className="fas fa-bone text-xl"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-extrabold text-slate-900 tracking-tight leading-tight">SBMC Bones Media</h1>
                                <p className="text-[10px] font-bold text-slate-500 uppercase tracking-widest">By <span className="text-red-500">Prottasha</span> SBMC</p>
                            </div>
                        </div>
                        
                        <div className="flex w-full md:w-auto items-center space-x-3">
                            <button 
                                onClick={onRefresh}
                                disabled={loading}
                                className={`p-3 rounded-2xl bg-slate-100/80 text-slate-500 hover:text-red-600 hover:bg-white transition-all ${loading ? 'opacity-50 cursor-not-allowed' : ''}`}
                                title="Refresh Catalog"
                            >
                                <i className={`fas fa-sync-alt ${loading ? 'animate-spin' : ''}`}></i>
                            </button>
                            <div className="relative flex-1 md:w-64">
                                <span className="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 pointer-events-none">
                                    <i className="fas fa-search text-sm"></i>
                                </span>
                                <input
                                    type="text"
                                    className="block w-full pl-11 pr-4 py-3 border-0 rounded-2xl bg-slate-100/80 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white transition-all text-sm font-medium"
                                    placeholder="Search Bone Sets"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>
                            <div className="relative">
                                <select 
                                    value={sortOrder}
                                    onChange={(e) => setSortOrder(e.target.value)}
                                    className="block w-36 pl-4 pr-10 py-3 rounded-2xl bg-slate-100/80 text-slate-600 text-xs font-bold uppercase tracking-wider focus:outline-none focus:ring-2 focus:ring-red-500 cursor-pointer border-0"
                                >
                                    <option value="newest">Recent</option>
                                    <option value="oldest">Oldest</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        );

        const App = () => {
            const [data, setData] = useState([]);
            const [columns, setColumns] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [sortOrder, setSortOrder] = useState('newest');
            const [previewImage, setPreviewImage] = useState(null);

            const fetchData = (url) => {
                setLoading(true);
                // Append a cache-buster timestamp to the URL to ensure fresh data
                const freshUrl = url + (url.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
                
                Papa.parse(freshUrl, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        if (results.data && results.data.length > 0) {
                            const cleanData = results.data.filter(row => Object.values(row).some(val => val && String(val).trim()));
                            setData(cleanData);
                            setColumns(results.meta.fields || Object.keys(cleanData[0]));
                            setLoading(false);
                            setError(null);
                        } else {
                            setError("The catalog is currently empty.");
                            setLoading(false);
                        }
                    },
                    error: () => { 
                        setError("Connection failed. Please check the source URL."); 
                        setLoading(false); 
                    }
                });
            };

            useEffect(() => { 
                fetchData(INITIAL_URL); 
            }, []);

            const fieldMap = useMemo(() => {
                if (columns.length === 0) return {};
                const findCol = (keywords) => columns.find(c => keywords.some(k => c.toLowerCase().includes(k)));
                return {
                    title: findCol(['product', 'name', 'title', 'item', 'person']) || columns[0],
                    image: findCol(['image', 'img', 'photo', 'url', 'picture', 'thumbnail', 'link']),
                    price: findCol(['price', 'cost', 'amount', 'rate', 'mrp']),
                    phone: findCol(['phone', 'mobile', 'contact', 'whatsapp', 'number']),
                    batch: findCol(['batch', 'lot', 'serial']),
                    category: findCol(['category', 'type', 'tag', 'group', 'class']),
                    description: findCol(['desc', 'detail', 'info', 'summary', 'about']),
                    timestamp: findCol(['timestamp', 'date', 'time', 'added'])
                };
            }, [columns]);

            const categories = useMemo(() => {
                if (!fieldMap.category) return ['All'];
                const cats = new Set(data.map(row => row[fieldMap.category]).filter(Boolean));
                return ['All', ...Array.from(cats).sort()];
            }, [data, fieldMap]);

            const processedData = useMemo(() => {
                let result = data.filter(row => {
                    const searchStr = searchTerm.toLowerCase();
                    const matchesSearch = !searchTerm || Object.values(row).some(val => val && String(val).toLowerCase().includes(searchStr));
                    const matchesCategory = selectedCategory === 'All' || row[fieldMap.category] === selectedCategory;
                    return matchesSearch && matchesCategory;
                });

                if (fieldMap.timestamp) {
                    result.sort((a, b) => {
                        const dateA = new Date(a[fieldMap.timestamp]);
                        const dateB = new Date(b[fieldMap.timestamp]);
                        if (isNaN(dateA.getTime())) return 1;
                        if (isNaN(dateB.getTime())) return -1;
                        return sortOrder === 'newest' ? dateB - dateA : dateA - dateB;
                    });
                }
                return result;
            }, [data, searchTerm, selectedCategory, sortOrder, fieldMap]);

            return (
                <div className="min-h-screen flex flex-col">
                    <Navbar 
                        searchTerm={searchTerm} 
                        setSearchTerm={setSearchTerm}
                        sortOrder={sortOrder}
                        setSortOrder={setSortOrder}
                        onRefresh={() => fetchData(INITIAL_URL)}
                        loading={loading}
                    />
                    
                    <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
                        {loading && data.length === 0 ? (
                            <div className="flex flex-col items-center justify-center h-[60vh]">
                                <div className="loader"></div>
                                <p className="mt-6 text-slate-400 font-semibold text-sm tracking-wide animate-pulse">LOADING CATALOG...</p>
                            </div>
                        ) : error ? (
                            <div className="flex flex-col items-center justify-center h-[60vh] text-center max-w-md mx-auto">
                                <div className="bg-rose-50 text-rose-500 w-20 h-20 flex items-center justify-center rounded-3xl mb-6">
                                    <i className="fas fa-cloud-bolt text-3xl"></i>
                                </div>
                                <h3 className="text-xl font-bold text-slate-800">{error}</h3>
                                <button onClick={() => fetchData(INITIAL_URL)} className="mt-8 px-8 py-3 bg-red-600 text-white rounded-2xl font-bold shadow-xl shadow-red-100 hover:bg-red-700 transition-colors">Try Refreshing</button>
                            </div>
                        ) : (
                            <div className="animate-fade-in">
                                <div className="flex flex-col md:flex-row justify-between items-baseline mb-10 gap-2 border-l-4 border-red-600 pl-6">
                                    <div className="flex items-center gap-4">
                                        <h2 className="text-5xl font-black text-slate-900 tracking-tight">{processedData.length}</h2>
                                        <p className="text-slate-400 text-xs font-extrabold uppercase tracking-[0.2em] mt-1">Bone sets available</p>
                                        {loading && <div className="loader !w-5 !h-5 !border-2 ml-2"></div>}
                                    </div>
                                </div>

                                {categories.length > 1 && (
                                    <div className="flex items-center gap-3 overflow-x-auto no-scrollbar pb-8 mb-4">
                                        {categories.map(cat => (
                                            <button
                                                key={cat}
                                                onClick={() => setSelectedCategory(cat)}
                                                className={`whitespace-nowrap px-8 py-2.5 rounded-2xl text-[11px] font-bold uppercase tracking-widest transition-all ${
                                                    selectedCategory === cat 
                                                    ? 'bg-red-600 text-white shadow-xl shadow-red-100 scale-105' 
                                                    : 'bg-white text-slate-500 border border-slate-100 hover:border-slate-300'
                                                }`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {processedData.length > 0 ? (
                                    <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
                                        {processedData.map((row, idx) => {
                                            const title = row[fieldMap.title] || "Unnamed Item";
                                            const image = formatImageUrl(row[fieldMap.image]);
                                            const category = row[fieldMap.category];
                                            const price = row[fieldMap.price];
                                            const phone = row[fieldMap.phone];
                                            const timestamp = row[fieldMap.timestamp];
                                            const batch = row[fieldMap.batch];
                                            const description = row[fieldMap.description];
                                            
                                            return (
                                                <div key={idx} className="bg-white rounded-[2rem] border border-slate-100 overflow-hidden card-hover flex flex-col h-full shadow-[0_4px_20px_-4px_rgba(0,0,0,0.03)] group">
                                                    <div 
                                                        className="relative h-60 bg-slate-50 flex items-center justify-center overflow-hidden cursor-zoom-in"
                                                        onClick={() => image && setPreviewImage({ url: image, title })}
                                                    >
                                                        {image ? (
                                                            <React.Fragment>
                                                                <img 
                                                                    src={image} 
                                                                    alt={title} 
                                                                    className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110"
                                                                    loading="lazy"
                                                                    onError={(e) => { e.target.src = 'https://placehold.co/400x300/f8fafc/cbd5e1?text=No+Photo'; }}
                                                                />
                                                                <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
                                                                    <div className="bg-white/40 backdrop-blur-[2px] px-3 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-widest text-slate-900 border border-white/40 shadow-sm transition-all group-hover:bg-white/70 group-hover:backdrop-blur-md group-hover:scale-110">
                                                                        Expand Image
                                                                    </div>
                                                                </div>
                                                            </React.Fragment>
                                                        ) : (
                                                            <div className="text-slate-200 flex flex-col items-center">
                                                                <i className="fas fa-bone text-4xl mb-3"></i>
                                                                <span className="text-[10px] font-bold uppercase tracking-widest">No Image</span>
                                                            </div>
                                                        )}
                                                        {category && (
                                                            <div className="absolute top-5 left-5 bg-white/80 backdrop-blur-md px-3.5 py-1.5 text-[9px] font-black text-slate-700 rounded-xl border border-white/50 uppercase tracking-[0.1em] z-10">
                                                                {category}
                                                            </div>
                                                        )}
                                                    </div>
                                                    
                                                    <div className="p-7 flex-1 flex flex-col">
                                                        <div className="flex justify-between items-start gap-4 mb-3">
                                                            <div className="min-w-0">
                                                                <h4 className="text-base font-bold text-slate-900 leading-tight group-hover:text-red-600 transition-colors duration-300 mb-2">{title}</h4>
                                                                {batch && (
                                                                    <div className="inline-flex items-center px-2 py-0.5 bg-slate-100 text-slate-600 border border-slate-200 rounded-md text-[10px] font-black uppercase tracking-widest">
                                                                        {batch}
                                                                    </div>
                                                                )}
                                                            </div>
                                                            {price && (
                                                                <div className="shrink-0 flex items-center px-2.5 py-1 bg-emerald-50 text-emerald-600 border border-emerald-100 rounded-lg text-xs font-black shadow-sm">
                                                                    ৳ {price}
                                                                </div>
                                                            )}
                                                        </div>

                                                        <ExpandableDescription text={description} />

                                                        <div className="mt-auto pt-5 border-t border-slate-50 flex items-center justify-between">
                                                            <div className="flex flex-col gap-1.5">
                                                                {phone && (
                                                                    <div className="flex items-center text-[11px] text-slate-600 font-bold tracking-tight">
                                                                        <i className="fas fa-phone-alt mr-2 text-emerald-500/50"></i>
                                                                        {phone}
                                                                    </div>
                                                                )}
                                                                {timestamp && (
                                                                    <div className="flex items-center text-[10px] text-slate-400 font-medium uppercase tracking-wider">
                                                                        <i className="far fa-clock mr-2"></i>
                                                                        {formatFriendlyDate(timestamp)}
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                ) : (
                                    <div className="py-24 text-center bg-white rounded-[3rem] border-2 border-dashed border-slate-100">
                                        <div className="bg-slate-50 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6">
                                            <i className="fas fa-ghost text-slate-200 text-3xl"></i>
                                        </div>
                                        <h3 className="text-xl font-bold text-slate-800">Nothing found here</h3>
                                        <p className="text-slate-400 mt-2 text-sm">Try using different keywords or filters.</p>
                                        <button onClick={() => {setSearchTerm(''); setSelectedCategory('All');}} className="mt-8 text-red-600 font-bold text-xs uppercase tracking-widest hover:underline decoration-2 underline-offset-4">Reset Dashboard</button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {previewImage && (
                        <ImagePopover 
                            imageUrl={previewImage.url} 
                            title={previewImage.title} 
                            onClose={() => setPreviewImage(null)} 
                        />
                    )}

                    <footer className="py-14 bg-white border-t border-slate-50 mt-12">
                        <div className="max-w-7xl mx-auto px-4 text-center">
                            <p className="text-slate-400 text-[9px] font-bold uppercase tracking-[0.4em] mb-8 opacity-70">Developed and Maintained by <a href="https://www.facebook.com/anik.mondal.819145" className="underline hover:text-red-500 transition-colors">Anik Mondal</a> (MBBS 56)</p>
                            
                            <div className="flex flex-col items-center gap-8">
                                <div className="flex flex-wrap justify-center gap-4">
                                    <a 
                                        href={"https://www.facebook.com/groups/866543802537795"} 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="group flex items-center gap-3 px-6 py-2.5 rounded-2xl bg-slate-50 border border-slate-100 hover:bg-[#1877F2]/5 hover:border-[#1877F2]/20 transition-all duration-300"
                                    >
                                        <i className="fab fa-facebook-messenger text-xl text-slate-400 group-hover:text-[#1877F2] transition-colors"></i>
                                        <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest group-hover:text-slate-900 transition-colors">Join</span>
                                    </a>
                                    <a 
                                        href={FACEBOOK_URL} 
                                        target="_blank" 
                                        rel="noopener noreferrer"
                                        className="group flex items-center gap-3 px-6 py-2.5 rounded-2xl bg-slate-50 border border-slate-100 hover:bg-[#1877F2]/5 hover:border-[#1877F2]/20 transition-all duration-300"
                                    >
                                        <i className="fab fa-facebook text-xl text-slate-400 group-hover:text-[#1877F2] transition-colors"></i>
                                        <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest group-hover:text-slate-900 transition-colors">Follow</span>
                                    </a>

                                    {WHATSAPP_NUMBERS.map(num => (
                                        <a 
                                            key={num}
                                            href={`https://wa.me/${num}`} 
                                            target="_blank" 
                                            rel="noopener noreferrer"
                                            className="group flex items-center gap-3 px-6 py-2.5 rounded-2xl bg-slate-50 border border-slate-100 hover:bg-[#25D366]/5 hover:border-[#25D366]/20 transition-all duration-300"
                                        >
                                            <i className="fab fa-whatsapp text-xl text-slate-400 group-hover:text-[#25D366] transition-colors"></i>
                                            <span className="text-[10px] font-black text-slate-500 uppercase tracking-widest group-hover:text-slate-900 transition-colors">{num}</span>
                                        </a>
                                    ))}
                                </div>

                                <div className="flex items-center justify-center gap-6">
                                    <div className="h-[1px] w-12 bg-slate-100"></div>
                                    <span className="text-lg font-black tracking-tighter flex items-center gap-2">
                                        <span className="text-red-600">PROTTASHA</span>
                                        <span className="text-slate-900">SBMC</span>
                                    </span>
                                    <div className="h-[1px] w-12 bg-slate-100"></div>
                                </div>
                                <span className="text-[10px] text-slate-900">© 2026 All Copyrights reserved.</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
