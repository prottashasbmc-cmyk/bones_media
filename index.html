<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBMC Bones Media by Prottasha</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS with Config for Dark Mode -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    
    <!-- PapaParse for robust CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
            padding-top: 80px;
        }
        
        @media (max-width: 768px) {
            body { padding-top: 140px; }
        }

        .dark body {
            background-color: #0f172a; /* slate-900 */
            color: #f1f5f9; /* slate-100 */
        }

        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #334155; }
        
        .loader {
            border: 3px solid #f1f5f9;
            border-top: 3px solid #ef4444;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            animation: spin 0.8s linear infinite;
        }
        .dark .loader { border-color: #1e293b; border-top-color: #ef4444; }
        
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .card-hover { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.1); }
        .card-hover:hover {
            transform: translateY(-8px);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        }
        
        .animate-fade-in { animation: fadeIn 0.6s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .animate-zoom-in { animation: zoomIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.92); } to { opacity: 1; transform: scale(1); } }

        .glass-nav {
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        .dark .glass-nav {
            background: rgba(15, 23, 42, 0.8);
            border-bottom-color: rgba(51, 65, 85, 0.5);
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2364748b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.75rem center;
            background-size: 1.1em;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .line-clamp-custom {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }

        /* Fixed Floating Controls Container */
        .floating-controls {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: flex-end;
        }

        @media (max-width: 640px) {
            .floating-controls {
                bottom: 1.5rem;
                right: 1.5rem;
            }
        }
    </style>
</head>
<body class="bg-[#fcfcfd] dark:bg-slate-900 transition-colors duration-300">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useCallback } = React;

        const INITIAL_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRRqEKvkB_9GnPOrbFKpUDpqMMA7uDMF1syrOuzkF_Q16OPeitxyzPp7liJJ6J1oWESc-wDs3GhvhIQ/pub?gid=484054578&single=true&output=csv";
        const FACEBOOK_URL = "https://www.facebook.com/people/Prottasha-SBMC/61584373444008/";
        const WHATSAPP_NUMBERS = ["+8801786792502", "+8801344343104", "+8801795589971"];
        const SBMC_LOGO_URL = "https://upload.wikimedia.org/wikipedia/en/7/75/Sher_e_Bangla_Medical_College_Logo.jpg";
        const PROTTASHA_LOGO_URL = "https://drive.google.com/thumbnail?id=1RvDdJVZrJ3-quShk5ZKF96qxaXFMpAwd&sz=w1000";
        const ITEMS_PER_PAGE = 12;

        const formatImageUrl = (url) => {
            if (!url) return null;
            let formatted = String(url).trim();
            if (formatted.includes('drive.google.com')) {
                const idMatch = formatted.match(/\/d\/([a-zA-Z0-9_-]+)/) || 
                               formatted.match(/id=([a-zA-Z0-9_-]+)/) || 
                               formatted.match(/\/file\/d\/([a-zA-Z0-9_-]+)/);
                if (idMatch && idMatch[1]) {
                    return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w1200`;
                }
            }
            return formatted;
        };

        const formatFriendlyDate = (dateString) => {
            if (!dateString) return null;
            const date = new Date(dateString);
            if (isNaN(date.getTime())) return dateString;
            return date.toLocaleDateString('en-US', { 
                month: 'short', 
                day: 'numeric', 
                year: date.getFullYear() !== new Date().getFullYear() ? 'numeric' : undefined 
            });
        };

        const ThemeToggleFloating = () => {
            const [isDark, setIsDark] = useState(false);

            useEffect(() => {
                const savedTheme = localStorage.getItem('theme');
                if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                    setIsDark(true);
                    document.documentElement.classList.add('dark');
                }
            }, []);

            const toggleTheme = () => {
                const newDark = !isDark;
                setIsDark(newDark);
                if (newDark) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                }
            };

            return (
                <div className="group flex items-center gap-3">
                    <span className="opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-slate-900/80 dark:bg-white/90 text-white dark:text-slate-900 text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-xl backdrop-blur-md shadow-xl pointer-events-none">
                        {isDark ? 'Switch to Light' : 'Switch to Dark'}
                    </span>
                    <button 
                        onClick={toggleTheme}
                        className="w-14 h-14 sm:w-16 sm:h-16 rounded-[1.5rem] bg-white dark:bg-slate-800 text-slate-500 dark:text-amber-400 border border-slate-200 dark:border-slate-700 shadow-2xl hover:scale-110 active:scale-90 transition-all flex items-center justify-center"
                        aria-label="Toggle Theme"
                    >
                        <i className={`fas ${isDark ? 'fa-sun' : 'fa-moon'} text-xl`}></i>
                    </button>
                </div>
            );
        };

        const ImagePopover = ({ imageUrl, title, onClose }) => {
            if (!imageUrl) return null;
            
            useEffect(() => {
                const handleEsc = (e) => { if (e.key === 'Escape') onClose(); };
                window.addEventListener('keydown', handleEsc);
                document.body.style.overflow = 'hidden';
                return () => {
                    window.removeEventListener('keydown', handleEsc);
                    document.body.style.overflow = 'unset';
                };
            }, [onClose]);

            return (
                <div 
                    className="fixed inset-0 z-[200] flex items-center justify-center p-4 sm:p-8 bg-white/60 dark:bg-slate-900/80 backdrop-blur-xl animate-fade-in"
                    onClick={onClose}
                >
                    <div 
                        className="relative max-w-5xl w-full max-h-full flex flex-col items-center animate-zoom-in"
                        onClick={e => e.stopPropagation()}
                    >
                        <button 
                            onClick={onClose}
                            className="absolute -top-16 right-0 md:-right-12 w-12 h-12 flex items-center justify-center rounded-full bg-slate-900/10 dark:bg-white/10 hover:bg-red-500 text-slate-900 dark:text-white hover:text-white transition-all duration-300 group shadow-lg border border-slate-900/5 dark:border-white/5 backdrop-blur-md"
                        >
                            <i className="fas fa-times text-xl group-hover:scale-110 transition-transform"></i>
                        </button>
                        
                        <img 
                            src={imageUrl} 
                            alt={title}
                            className="max-w-full max-h-[80vh] object-contain rounded-2xl shadow-2xl ring-1 ring-slate-900/10 dark:ring-white/10"
                            onError={(e) => { e.target.src = 'https://placehold.co/800x600/f1f5f9/94a3b8?text=Image+Unavailable'; }}
                        />
                        
                        <div className="mt-6 text-center px-4 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md py-2 px-6 rounded-full border border-white/50 dark:border-slate-700 shadow-sm">
                            <h3 className="text-slate-900 dark:text-slate-100 text-lg font-bold tracking-tight">{title}</h3>
                        </div>
                    </div>
                </div>
            );
        };

        const ExpandableDescription = ({ text }) => {
            const [isExpanded, setIsExpanded] = useState(false);
            const needsExpansion = text && text.length > 85;

            if (!text) return null;

            return (
                <div className="mb-6">
                    <p className={`text-slate-500 dark:text-slate-400 text-xs leading-relaxed italic ${!isExpanded && needsExpansion ? 'line-clamp-custom' : ''}`}>
                        {text}
                    </p>
                    {needsExpansion && (
                        <button 
                            onClick={(e) => { e.stopPropagation(); setIsExpanded(!isExpanded); }}
                            className="mt-1.5 text-[10px] font-extrabold text-red-500 uppercase tracking-wider hover:text-red-700 dark:hover:text-red-400 transition-colors flex items-center gap-1"
                        >
                            {isExpanded ? (
                                <React.Fragment>Read Less <i className="fas fa-chevron-up text-[8px]"></i></React.Fragment>
                            ) : (
                                <React.Fragment>Read More <i className="fas fa-chevron-down text-[8px]"></i></React.Fragment>
                            )}
                        </button>
                    )}
                </div>
            );
        };

        const Navbar = ({ searchTerm, setSearchTerm, sortOrder, setSortOrder }) => (
            <nav className="glass-nav border-b border-slate-100 dark:border-slate-800 fixed top-0 left-0 right-0 z-50 shadow-sm">
                <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                    <div className="flex flex-col md:flex-row justify-between items-center h-auto md:h-20 py-5 md:py-0 gap-5">
                        <div className="flex items-center group cursor-pointer" onClick={() => window.scrollTo({top: 0, behavior: 'smooth'})}>
                            <div className="bg-red-500 text-white p-2.5 rounded-2xl mr-4 shadow-xl shadow-red-100 dark:shadow-red-900/20 group-hover:rotate-6 transition-transform">
                                <i className="fas fa-bone text-xl"></i>
                            </div>
                            <div>
                                <h1 className="text-xl font-extrabold text-slate-900 dark:text-white tracking-tight leading-tight">SBMC Bones Media</h1>
                                <p className="text-[10px] font-bold text-slate-500 dark:text-slate-400 uppercase tracking-widest">By <span className="text-red-500">Prottasha</span> SBMC</p>
                            </div>
                        </div>
                        
                        <div className="flex w-full md:w-auto items-center space-x-3">
                            <div className="relative flex-1 md:w-80">
                                <span className="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400 pointer-events-none">
                                    <i className="fas fa-search text-sm"></i>
                                </span>
                                <input
                                    type="text"
                                    className="block w-full pl-11 pr-4 py-3 border-0 rounded-2xl bg-slate-100/80 dark:bg-slate-800 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-red-500 focus:bg-white dark:focus:bg-slate-700 transition-all text-sm font-medium dark:text-slate-100"
                                    placeholder="Search Bone Sets"
                                    value={searchTerm}
                                    onChange={(e) => setSearchTerm(e.target.value)}
                                />
                            </div>
                            <div className="relative">
                                <select 
                                    value={sortOrder}
                                    onChange={(e) => setSortOrder(e.target.value)}
                                    className="block w-36 pl-4 pr-10 py-3 rounded-2xl bg-slate-100/80 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-xs font-bold uppercase tracking-wider focus:outline-none focus:ring-2 focus:ring-red-500 cursor-pointer border-0"
                                >
                                    <option value="newest">Recent</option>
                                    <option value="oldest">Oldest</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </nav>
        );

        const Pagination = ({ currentPage, totalPages, onPageChange }) => {
            if (totalPages <= 1) return null;

            const getPages = () => {
                const pages = [];
                const maxVisible = 5;
                let start = Math.max(1, currentPage - 2);
                let end = Math.min(totalPages, start + maxVisible - 1);
                
                if (end - start < maxVisible - 1) {
                    start = Math.max(1, end - maxVisible + 1);
                }

                for (let i = start; i <= end; i++) pages.push(i);
                return pages;
            };

            return (
              <div className="sticky left-4 bottom-[1.5rem] flex flex-col gap-4 items-end bg-white/90 dark:bg-slate-800 text-white dark:text-slate-900 text-[10px] font-black uppercase w-min rounded-3xl backdrop-blur-md shadow-xl border border-slate-200 dark:border-slate-700 flex items-center justify-center"> 
                <div className="flex justify-center items-center gap-2 mt-1 mb-1 px-4 py-2">
                    <button 
                        onClick={() => onPageChange(currentPage - 1)}
                        disabled={currentPage === 1}
                        className="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl flex items-center justify-center border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-red-50 dark:hover:bg-slate-800 hover:text-red-500 hover:border-red-200 disabled:opacity-30 disabled:hover:bg-transparent transition-all"
                    >
                        <i className="fas fa-chevron-left text-xs"></i>
                    </button>
                    
                    {getPages().map(pageNum => (
                        <button
                            key={pageNum}
                            onClick={() => onPageChange(pageNum)}
                            className={`w-10 h-10 sm:w-12 sm:h-12 rounded-2xl flex items-center justify-center text-[11px] font-black tracking-widest transition-all ${
                                currentPage === pageNum 
                                ? 'bg-red-500 text-white shadow-xl shadow-red-100 dark:shadow-red-900/20 scale-110' 
                                : 'text-slate-400 border border-slate-100 dark:border-slate-800 hover:bg-white dark:hover:bg-slate-700 hover:text-slate-900 dark:hover:text-white hover:border-slate-300 dark:hover:border-slate-600'
                            }`}
                        >
                            {pageNum}
                        </button>
                    ))}

                    <button 
                        onClick={() => onPageChange(currentPage + 1)}
                        disabled={currentPage === totalPages}
                        className="w-10 h-10 sm:w-12 sm:h-12 rounded-2xl flex items-center justify-center border border-slate-200 dark:border-slate-700 text-slate-500 dark:text-slate-400 hover:bg-red-50 dark:hover:bg-slate-800 hover:text-red-500 hover:border-red-200 disabled:opacity-30 disabled:hover:bg-transparent transition-all"
                    >
                        <i className="fas fa-chevron-right text-xs"></i>
                    </button>
                </div>
              </div>
            );
        };

        const App = () => {
            const [data, setData] = useState([]);
            const [columns, setColumns] = useState([]);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [searchTerm, setSearchTerm] = useState('');
            const [selectedCategory, setSelectedCategory] = useState('All');
            const [sortOrder, setSortOrder] = useState('newest');
            const [previewImage, setPreviewImage] = useState(null);
            const [currentPage, setCurrentPage] = useState(1);

            const fetchData = useCallback((url) => {
                setLoading(true);
                const freshUrl = url + (url.includes('?') ? '&' : '?') + 't=' + new Date().getTime();
                
                Papa.parse(freshUrl, {
                    download: true,
                    header: true,
                    skipEmptyLines: true,
                    complete: (results) => {
                        if (results.data && results.data.length > 0) {
                            const cleanData = results.data.filter(row => Object.values(row).some(val => val && String(val).trim()));
                            setData(cleanData);
                            setColumns(results.meta.fields || Object.keys(cleanData[0]));
                            setLoading(false);
                            setError(null);
                        } else {
                            setError("The catalog is currently empty.");
                            setLoading(false);
                        }
                    },
                    error: () => { 
                        setError("Connection failed. Please check the source URL."); 
                        setLoading(false); 
                    }
                });
            }, []);

            useEffect(() => { 
                fetchData(INITIAL_URL); 
            }, [fetchData]);

            useEffect(() => {
                setCurrentPage(1);
            }, [searchTerm, selectedCategory, sortOrder]);

            const fieldMap = useMemo(() => {
                if (columns.length === 0) return {};
                const findCol = (keywords) => columns.find(c => keywords.some(k => c.toLowerCase().includes(k)));
                return {
                    title: findCol(['product', 'name', 'title', 'item', 'person']) || columns[0],
                    image: findCol(['image', 'img', 'photo', 'url', 'picture', 'thumbnail', 'link']),
                    price: findCol(['price', 'cost', 'amount', 'rate', 'mrp']),
                    phone: findCol(['phone', 'mobile', 'contact', 'whatsapp', 'number']),
                    batch: findCol(['batch', 'lot', 'serial']),
                    category: findCol(['category', 'type', 'tag', 'group', 'class']),
                    description: findCol(['desc', 'detail', 'info', 'summary', 'about']),
                    timestamp: findCol(['timestamp', 'date', 'time', 'added'])
                };
            }, [columns]);

            const categories = useMemo(() => {
                if (!fieldMap.category) return ['All'];
                const cats = new Set(data.map(row => row[fieldMap.category]).filter(Boolean));
                return ['All', ...Array.from(cats).sort()];
            }, [data, fieldMap]);

            const filteredSortedData = useMemo(() => {
                let result = data.filter(row => {
                    const searchStr = searchTerm.toLowerCase();
                    const matchesSearch = !searchTerm || Object.values(row).some(val => val && String(val).toLowerCase().includes(searchStr));
                    const matchesCategory = selectedCategory === 'All' || row[fieldMap.category] === selectedCategory;
                    return matchesSearch && matchesCategory;
                });

                if (fieldMap.timestamp) {
                    result.sort((a, b) => {
                        const dateA = new Date(a[fieldMap.timestamp]);
                        const dateB = new Date(b[fieldMap.timestamp]);
                        if (isNaN(dateA.getTime())) return 1;
                        if (isNaN(dateB.getTime())) return -1;
                        return sortOrder === 'newest' ? dateB - dateA : dateA - dateB;
                    });
                }
                return result;
            }, [data, searchTerm, selectedCategory, sortOrder, fieldMap]);

            const totalPages = Math.ceil(filteredSortedData.length / ITEMS_PER_PAGE);
            
            const paginatedData = useMemo(() => {
                const startIndex = (currentPage - 1) * ITEMS_PER_PAGE;
                return filteredSortedData.slice(startIndex, startIndex + ITEMS_PER_PAGE);
            }, [filteredSortedData, currentPage]);

            const handlePageChange = (newPage) => {
                setCurrentPage(newPage);
                const gridElement = document.getElementById('product-grid-start');
                if (gridElement) {
                    const offset = 120;
                    const bodyRect = document.body.getBoundingClientRect().top;
                    const elementRect = gridElement.getBoundingClientRect().top;
                    const elementPosition = elementRect - bodyRect;
                    const offsetPosition = elementPosition - offset;
                    window.scrollTo({ top: offsetPosition, behavior: 'smooth' });
                }
            };

            return (
                <div className="min-h-screen flex flex-col transition-colors duration-300">
                    <Navbar 
                        searchTerm={searchTerm} 
                        setSearchTerm={setSearchTerm}
                        sortOrder={sortOrder}
                        setSortOrder={setSortOrder}
                    />
                    
                    {/* Floating Controls (Theme & Refresh) */}
                    <div className="floating-controls">
                        
                        <ThemeToggleFloating />
                        <div className="group flex items-center gap-3">
                            <span className="opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-slate-900/80 dark:bg-white/90 text-white dark:text-slate-900 text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-xl backdrop-blur-md shadow-xl pointer-events-none">
                                Refresh Catalog
                            </span>
                            <button 
                                onClick={() => fetchData(INITIAL_URL)}
                                disabled={loading}
                                className={`w-14 h-14 sm:w-16 sm:h-16 rounded-[1.5rem] bg-red-500 shadow-2xl shadow-red-500/30 flex items-center justify-center text-white border border-red-400/30 transition-all ${loading ? 'opacity-50 cursor-not-allowed' : 'hover:scale-110 active:scale-90 hover:bg-red-600'}`}
                            >
                                <i className={`fas fa-sync-alt text-xl ${loading ? 'animate-spin' : ''}`}></i>
                            </button>
                        </div>
                        <div className="group flex items-center gap-3">
                            <span className="opacity-0 group-hover:opacity-100 transition-opacity duration-300 bg-slate-900/80 dark:bg-white/90 text-white dark:text-slate-900 text-[10px] font-black uppercase tracking-widest px-4 py-2 rounded-xl backdrop-blur-md shadow-xl pointer-events-none">
                                Add New Bone Set
                            </span>
                            <button 
  onClick={() => window.open('https://docs.google.com/forms/d/1RoNPD9wR17Eu7BLQuuYmEDG8fdIUmndAiNbEBb7YRIM/edit?pli=1', '_blank')}
  aria-label="Add Item"
  className="
    w-14 h-14 sm:w-16 sm:h-16 
    flex items-center justify-center 
    rounded-[2rem] bg-red-600 text-white 
    border border-red-400/30 
    shadow-2xl shadow-red-500/30 
    transition-all duration-200
    hover:scale-110 
    active:scale-95
  "
>
  <i className="fa fa-plus text-2xl" aria-hidden="true"></i>
</button>
                        </div>
                    </div>

                    <main className="relative flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-10">
                        {loading && data.length === 0 ? (
                            <div className="flex flex-col items-center justify-center h-[60vh]">
                                <div className="loader"></div>
                                <p className="mt-6 text-slate-400 dark:text-slate-500 font-semibold text-sm tracking-wide animate-pulse uppercase">Syncing Database...</p>
                            </div>
                        ) : error ? (
                            <div className="flex flex-col items-center justify-center h-[60vh] text-center max-w-md mx-auto">
                                <div className="bg-rose-50 dark:bg-rose-950/30 text-rose-500 w-20 h-20 flex items-center justify-center rounded-3xl mb-6">
                                    <i className="fas fa-cloud-bolt text-3xl"></i>
                                </div>
                                <h3 className="text-xl font-bold text-slate-800 dark:text-slate-200">{error}</h3>
                                <button onClick={() => fetchData(INITIAL_URL)} className="mt-8 px-8 py-3 bg-red-500 text-white rounded-2xl font-bold shadow-xl shadow-red-100 dark:shadow-red-900/20 hover:bg-red-600 transition-colors">Try Refreshing</button>
                            </div>
                        ) : (
                            <div className="animate-fade-in" id="product-grid-start">
                                <div className="flex flex-col md:flex-row justify-between items-baseline mb-10 gap-4 border-l-4 border-red-500 pl-6">
                                    <div className="flex items-center gap-4">
                                        <h2 className="text-5xl font-black text-slate-900 dark:text-white tracking-tight">{filteredSortedData.length}</h2>
                                        <p className="text-slate-400 dark:text-slate-500 text-xs font-extrabold uppercase tracking-[0.2em] mt-1">Bone Sets Found</p>
                                    </div>
                                    <div className="flex items-center gap-3">
                                        <span className="text-[10px] font-black text-slate-400 dark:text-slate-500 uppercase tracking-widest bg-white dark:bg-slate-800 border border-slate-100 dark:border-slate-700 px-4 py-2 rounded-xl shadow-sm">
                                            Page {currentPage} / {totalPages || 1}
                                        </span>
                                    </div>
                                </div>

                                {categories.length > 1 && (
                                    <div className="flex items-center gap-3 overflow-x-auto no-scrollbar pb-8 mb-4">
                                        {categories.map(cat => (
                                            <button
                                                key={cat}
                                                onClick={() => setSelectedCategory(cat)}
                                                className={`whitespace-nowrap px-8 py-2.5 rounded-2xl text-[11px] font-bold uppercase tracking-widest transition-all ${
                                                    selectedCategory === cat 
                                                    ? 'bg-red-500 text-white shadow-xl shadow-red-100 dark:shadow-red-900/40 scale-105' 
                                                    : 'bg-white dark:bg-slate-800 text-slate-500 dark:text-slate-400 border border-slate-100 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 shadow-sm'
                                                }`}
                                            >
                                                {cat}
                                            </button>
                                        ))}
                                    </div>
                                )}

                                {paginatedData.length > 0 ? (
                                    <React.Fragment>
                                        <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8 hover:scale-102 transition-transform duration-300">
                                            {paginatedData.map((row, idx) => {
                                                const title = row[fieldMap.title] || "Unnamed Item";
                                                const image = formatImageUrl(row[fieldMap.image]);
                                                const category = row[fieldMap.category];
                                                const price = row[fieldMap.price];
                                                const phone = row[fieldMap.phone];
                                                const timestamp = row[fieldMap.timestamp];
                                                const batch = row[fieldMap.batch];
                                                const description = row[fieldMap.description];
                                                
                                                return (
                                                    <div key={idx} className="bg-white dark:bg-slate-800 rounded-[2rem] border border-slate-100 dark:border-slate-700/50 overflow-hidden card-hover flex flex-col h-full shadow-sm dark:shadow-2xl dark:shadow-black/20 group animate-fade-in" style={{animationDelay: `${(idx % 12) * 50}ms`}}>
                                                        <div 
                                                            className="relative h-64 bg-slate-50 dark:bg-slate-900 flex items-center justify-center overflow-hidden cursor-zoom-in"
                                                            onClick={() => image && setPreviewImage({ url: image, title })}
                                                        >
                                                            {image ? (
                                                                <React.Fragment>
                                                                    <img 
                                                                        src={image} 
                                                                        alt={title} 
                                                                        className="w-full h-full object-cover transition-transform duration-1000 group-hover:scale-110"
                                                                        loading="lazy"
                                                                        onError={(e) => { e.target.src = 'https://placehold.co/400x300/f8fafc/cbd5e1?text=No+Photo'; }}
                                                                    />
                                                                    <div className="absolute inset-0 bg-black/0 group-hover:bg-black/5 transition-colors pointer-events-none flex items-center justify-center">
                                                                        <div className="bg-white/40 dark:bg-slate-900/40 backdrop-blur-[2px] px-3 py-1.5 rounded-lg text-[9px] font-black uppercase tracking-widest text-slate-900 dark:text-white border border-white/40 dark:border-white/10 shadow-sm opacity-100 transition-all transform translate-y-2 group-hover:translate-y-0">
                                                                            Expand Photo
                                                                        </div>
                                                                    </div>
                                                                </React.Fragment>
                                                            ) : (
                                                                <div className="text-slate-200 dark:text-slate-800 flex flex-col items-center">
                                                                    <i className="fas fa-bone text-4xl mb-3"></i>
                                                                    <span className="text-[10px] font-bold uppercase tracking-widest">No Image</span>
                                                                </div>
                                                            )}
                                                            {category && (
                                                                <div className="absolute top-5 left-5 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md px-3.5 py-1.5 text-[9px] font-black text-slate-700 dark:text-slate-300 rounded-xl border border-white/50 dark:border-slate-700 uppercase tracking-[0.1em] z-10 shadow-sm">
                                                                    {category}
                                                                </div>
                                                            )}
                                                        </div>
                                                        
                                                        <div className="p-7 flex-1 flex flex-col">
                                                            <div className="flex justify-between items-start gap-4 mb-4">
                                                                <div className="min-w-0">
                                                                    <h4 className="text-base font-bold text-slate-900 dark:text-white leading-tight group-hover:text-red-500 transition-colors duration-300 mb-2">{title}</h4>
                                                                    {batch && (
                                                                        <div className="inline-flex items-center px-2 py-0.5 bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-400 border border-slate-200 dark:border-slate-600 rounded-md text-[10px] font-black uppercase tracking-widest">
                                                                            {batch}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                                {price && (
                                                                    <div className="shrink-0 flex items-center px-3 py-1.5 bg-emerald-50 dark:bg-emerald-950/30 text-emerald-600 dark:text-emerald-400 border border-emerald-100 dark:border-emerald-900/50 rounded-xl text-xs font-black shadow-sm">
                                                                        ৳ {price}
                                                                    </div>
                                                                )}
                                                            </div>

                                                            <ExpandableDescription text={description} />

                                                            <div className="mt-auto pt-6 border-t border-slate-50 dark:border-slate-700/50 flex items-center justify-between">
                                                                <div className="flex flex-col gap-2">
                                                                    {phone && (
                                                                        <div className="flex items-center text-[12px] text-slate-600 dark:text-slate-400 font-bold tracking-tight">
                                                                            <i className="fas fa-phone-alt mr-2.5 text-emerald-500/50 dark:text-emerald-400/50"></i>
                                                                            {phone}
                                                                        </div>
                                                                    )}
                                                                    {timestamp && (
                                                                        <div className="flex items-center text-[11px] text-slate-400 dark:text-slate-500 font-medium uppercase tracking-wider">
                                                                            <i className="far fa-clock mr-2.5"></i>
                                                                            {formatFriendlyDate(timestamp)}
                                                                        </div>
                                                                    )}
                                                                </div>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                        
                                        
                                    </React.Fragment>
                                ) : (
                                    <div className="py-24 text-center bg-white dark:bg-slate-800 rounded-[3rem] border-2 border-dashed border-slate-100 dark:border-slate-700 shadow-sm">
                                        <div className="bg-slate-50 dark:bg-slate-900 w-20 h-20 rounded-3xl flex items-center justify-center mx-auto mb-6">
                                            <i className="fas fa-ghost text-slate-200 dark:text-slate-700 text-3xl"></i>
                                        </div>
                                        <h3 className="text-xl font-bold text-slate-800 dark:text-slate-200">No matching bone sets</h3>
                                        <p className="text-slate-400 dark:text-slate-500 mt-2 text-sm">Try different keywords or filters.</p>
                                        <button onClick={() => {setSearchTerm(''); setSelectedCategory('All');}} className="mt-8 text-red-500 font-bold text-xs uppercase tracking-widest hover:underline decoration-2 underline-offset-4">Clear All Filters</button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                    <Pagination 
                                            currentPage={currentPage} 
                                            totalPages={totalPages} 
                                            onPageChange={handlePageChange} 
                                        />

                    {previewImage && (
                        <ImagePopover 
                            imageUrl={previewImage.url} 
                            title={previewImage.title} 
                            onClose={() => setPreviewImage(null)} 
                        />
                    )}

                    <footer className="py-20 bg-white dark:bg-slate-900/50 border-t border-slate-50 dark:border-slate-800/50 mt-12 transition-colors duration-300">
                        <div className="max-w-7xl mx-auto px-4 text-center">
                            <p className="text-slate-400 dark:text-slate-500 text-[9px] font-bold uppercase tracking-[0.4em] mb-12 opacity-70">Developed and Maintained by <a href="https://www.facebook.com/anik.mondal.819145" className="underline text-slate-700 dark:text-slate-300 hover:text-red-500 transition-colors">Anik Mondal</a> (MBBS 56) & team</p>
                            
                            <div className="flex flex-col items-center gap-14">
                                <div className="flex flex-wrap justify-center gap-5">
                                    <a href={"https://www.facebook.com/groups/866543802537795"} target="_blank" rel="noopener noreferrer" className="group flex items-center gap-4 px-8 py-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 hover:bg-[#1877F2]/5 hover:border-[#1877F2]/20 transition-all duration-300 shadow-sm">
                                        <i className="fab fa-facebook-messenger text-2xl text-slate-400 dark:text-slate-600 group-hover:text-[#1877F2] transition-colors"></i>
                                        <div className="text-left">
                                            <span className="block text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest group-hover:text-slate-900 dark:group-hover:text-white transition-colors">Join Group</span>
                                        </div>
                                    </a>
                                    <a href={FACEBOOK_URL} target="_blank" rel="noopener noreferrer" className="group flex items-center gap-4 px-8 py-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 hover:bg-[#1877F2]/5 hover:border-[#1877F2]/20 transition-all duration-300 shadow-sm">
                                        <i className="fab fa-facebook text-2xl text-slate-400 dark:text-slate-600 group-hover:text-[#1877F2] transition-colors"></i>
                                        <div className="text-left">
                                            <span className="block text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest group-hover:text-slate-900 dark:group-hover:text-white transition-colors">Follow Page</span>
                                        </div>
                                    </a>
                                    {WHATSAPP_NUMBERS.map(num => (
                                        <a key={num} href={`https://wa.me/${num}`} target="_blank" rel="noopener noreferrer" className="group flex items-center gap-4 px-8 py-3 rounded-2xl bg-slate-50 dark:bg-slate-800 border border-slate-100 dark:border-slate-700 hover:bg-[#25D366]/5 hover:border-[#25D366]/20 transition-all duration-300 shadow-sm">
                                            <i className="fab fa-whatsapp text-2xl text-slate-400 dark:text-slate-600 group-hover:text-[#25D366] transition-colors"></i>
                                            <div className="text-left">
                                                <span className="block text-[10px] font-black text-slate-500 dark:text-slate-400 uppercase tracking-widest group-hover:text-slate-900 dark:group-hover:text-white transition-colors">{num}</span>
                                            </div>
                                        </a>
                                    ))}
                                </div>
                                
                                <div className="flex flex-col items-center">
                                    <p className="text-[11px] font-black text-slate-400 dark:text-slate-600 uppercase tracking-[0.4em] mb-6 opacity-80">Powered by</p>
                                    <div className="flex flex-col items-center gap-10">
                                        <div className="flex items-center justify-center gap-6">
                                            <div className="h-[1px] w-8 bg-slate-100 dark:bg-slate-800"></div>
                                            
                                                <div className="p-[5px] bg-white rounded-2xl shadow-sm transition-transform hover:scale-105 border border-slate-50 dark:border-slate-50">
                                                    <img 
                                                        src={PROTTASHA_LOGO_URL} 
                                                        alt="Prottasha Logo" 
                                                        className="h-14 sm:h-14 w-auto object-contain brightness-100 dark:brightness-90 rounded-xl"
                                                        onError={(e) => { e.target.style.display = 'none'; }}
                                                    />
                                                </div>
                                            
                                            <div className="h-[1px] w-8 bg-slate-100 dark:bg-slate-800"></div>
                                        </div>
                                        
                                        <div className="flex items-center gap-2 py-5 px-5 bg-white dark:bg-slate-900 rounded-[2rem] max-w-[450px] group transition-all duration-300 hover:scale-105">
                                            <img 
                                                src={SBMC_LOGO_URL} 
                                                alt="SBMC Logo" 
                                                className="w-10 h-10 object-contain shrink-0 rounded-[0.5rem]"
                                                onError={(e) => { e.target.style.display = 'none'; }}
                                            />
                                            <span className="text-[10px] font-extrabold text-slate-700 dark:text-slate-400 uppercase tracking-[0.2em] text-left leading-relaxed">
                                                Sher-E-Bangla Medical College, Barishal
                                            </span>
                                        </div>
                                    </div>
                                </div>
                                <span className="text-[11px] font-bold text-slate-400 dark:text-slate-600 uppercase tracking-widest mt-16 block">© 2026 All Copyrights Reserved.</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
